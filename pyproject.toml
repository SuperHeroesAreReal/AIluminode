[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ailuminode"
version = "0.1.0"
description = "A lightweight cognitive-orientation EEG instrument for AI tools."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
ailuminode = "ailuminode.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
